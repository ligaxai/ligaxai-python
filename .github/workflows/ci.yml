name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.30"
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Sync dependencies
        run: uv sync --all-groups --locked

      - name: Lint
        run: |
          uv run ruff check src tests scripts examples
          uv run ruff format --check src tests scripts examples

      - name: Typecheck
        run: |
          uv run mypy
          uv run pyright

      - name: Generated models match the pinned spec
        run: uv run python scripts/gen_types.py --check

      - name: Tests with coverage gate
        run: uv run pytest --cov --cov-report=term-missing

      - name: Build
        run: uv build --no-sources

      - name: Type completeness (>= 95%)
        run: uv run python scripts/verify_types.py --min 95

  lockfile:
    name: uv.lock is current
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.30"
      - run: uv lock --check
      # Known-vulnerable dependencies fail the build: the runtime set, as users install it.
      - name: Audit runtime dependencies
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt > runtime.txt
          uvx pip-audit@2.10.0 --strict -r runtime.txt

  workflows:
    # The release workflow holds publish rights; any change to a workflow is audited before merge.
    name: workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.30"
      - run: uvx zizmor@1.16.0 --offline --min-severity medium .github/workflows

  # One check name for branch protection. A pull request that renames a matrix job still
  # fails this gate, and protection does not have to list every matrix cell.
  ci-gate:
    name: ci-gate
    needs: [test, lockfile, workflows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        env:
          TEST_RESULT: ${{ needs.test.result }}
          LOCKFILE_RESULT: ${{ needs.lockfile.result }}
          WORKFLOWS_RESULT: ${{ needs.workflows.result }}
        run: |
          set -eu
          fail=0
          for name in TEST LOCKFILE WORKFLOWS; do
            value="$(printenv "${name}_RESULT")"
            if [ "$value" != "success" ]; then
              echo "::error::${name} finished as ${value}"
              fail=1
            fi
          done
          exit "$fail"
