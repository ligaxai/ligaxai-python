name: Release

# Two channels, one package name, one index:
#
#   dev  — every push to `dev` publishes a PEP 440 pre-release `X.Y.Z.dev<run>` (X.Y.Z from
#          src/ligaxai/_version.py). `pip install ligaxai` never picks these up; only an explicit
#          pin (`ligaxai==0.1.0.dev42`) or `pip install --pre ligaxai` does. Environment `pypi-dev`.
#   main — every push to `main` releases the version in src/ligaxai/_version.py, unless PyPI already
#          has it (then the run says so and publishes nothing). The publish waits for approval in
#          environment `pypi`; afterwards the workflow tags the commit `vX.Y.Z`. This is the same
#          flow as the TypeScript SDK: bump the version in the dev → main release PR, merge, approve.
#
# PyPI trusted publishing needs one publisher entry per (workflow, environment): register both
# (project `ligaxai`, owner `ligaxai`, repo `ligaxai-python`, workflow `release.yml`,
# environments `pypi` and `pypi-dev`). No token is stored anywhere; OIDC is the credential.
#
# **Two switches, one per channel** (repository *variables*, not secrets: a secret cannot be read in a
# job's `if:`, and an on/off switch is not secret). Anything other than the exact string `true` is off.
#   PUBLISH_DEV_ENABLED   true → every push to `dev` publishes `X.Y.Z.dev<run>`.
#   PUBLISH_MAIN_ENABLED  true → a push to `main` with a new version publishes the stable release.
# While a switch is off the build and tests still run, and the run ends with a notice naming it.
#
# **Versions only go up.** scripts/dev_version.py raises the base above anything already on PyPI
# (PEP 440 orders 0.1.0.dev1 < 0.1.0 < 0.1.1.dev1), so a stable release nobody followed with a
# bump on `dev` can never make the next dev build sort below it. Bumping _version.py on `dev` after a
# stable release is still the tidy thing to do. A re-run of the same run skips files already uploaded.

on:
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
      published: ${{ steps.meta.outputs.published }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.30"
          python-version: "3.12"
          # A release is built from a clean resolve: a cache written by any other branch's run
          # must never feed what gets published.
          enable-cache: false
      - name: Resolve channel and version
        id: meta
        run: |
          base="$(uv run --no-project python -c "import re,pathlib;print(re.search(r'\"([^\"]+)\"', pathlib.Path('src/ligaxai/_version.py').read_text()).group(1))")"
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            # A stable version is published once. If PyPI already has it, this push to main carries
            # no release (a merge with no version bump) and the run ends with a notice.
            code="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/ligaxai/${base}/json")"
            case "$code" in
              200) published=true ;;
              404) published=false ;;
              *) echo "PyPI answered ${code} for ligaxai ${base}; refusing to guess" >&2; exit 1 ;;
            esac
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=$base" >> "$GITHUB_OUTPUT"
            echo "published=$published" >> "$GITHUB_OUTPUT"
          else
            v="$(uv run --no-project python scripts/dev_version.py "$base" "${GITHUB_RUN_NUMBER}")"
            # The pre-release version is stamped into the build only; nothing is committed.
            printf '__version__ = "%s"\n' "$v" > src/ligaxai/_version.py
            echo "channel=dev" >> "$GITHUB_OUTPUT"
            echo "version=$v" >> "$GITHUB_OUTPUT"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - run: uv sync --all-groups --locked
      - run: uv run ruff check src tests scripts examples && uv run mypy && uv run pyright
      - run: uv run pytest
      - run: uv build --no-sources
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # One switch per channel (see the header). While a channel is off the build above still proves the
  # sdist and wheel, and `skipped` below says which switch is off.
  publish:
    needs: build
    if: >-
      (needs.build.outputs.channel == 'dev' && vars.PUBLISH_DEV_ENABLED == 'true') ||
      (needs.build.outputs.channel == 'stable' && vars.PUBLISH_MAIN_ENABLED == 'true' &&
       needs.build.outputs.published == 'false')
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build.outputs.channel == 'stable' && 'pypi' || 'pypi-dev' }}
      url: https://pypi.org/project/ligaxai/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # trusted publishing (OIDC) — no PyPI token stored anywhere
      contents: read
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
          print-hash: true
          # A re-run of the same workflow run rebuilds the same version; PyPI refuses a second upload
          # of a file, so skip what is already there instead of failing.
          skip-existing: true

  # After a stable publish, mark the commit `vX.Y.Z`, like the TypeScript SDK's tag-stable job.
  tag-stable:
    needs: [build, publish]
    if: needs.build.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
      - name: Tag the release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists"
            exit 0
          fi
          git tag "${tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag}"

  already-released:
    needs: build
    if: needs.build.outputs.channel == 'stable' && needs.build.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          echo "::notice title=Nothing to release::ligaxai ${VERSION} is already on PyPI. Bump src/ligaxai/_version.py (and CHANGELOG.md) in the release pull request to publish a new version."

  skipped:
    needs: build
    if: >-
      (needs.build.outputs.channel == 'dev' && vars.PUBLISH_DEV_ENABLED != 'true') ||
      (needs.build.outputs.channel == 'stable' && vars.PUBLISH_MAIN_ENABLED != 'true')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          VERSION: ${{ needs.build.outputs.version }}
          SWITCH: ${{ needs.build.outputs.channel == 'stable' && 'PUBLISH_MAIN_ENABLED' || 'PUBLISH_DEV_ENABLED' }}
        run: |
          echo "::notice title=PyPI publish skipped::Built ${VERSION} but did not publish: repository variable ${SWITCH} is not 'true'."
