name: Release

# Two channels, one package name, one index:
#
#   dev  — every push to `dev` publishes a PEP 440 pre-release `X.Y.Z.dev<run>` (X.Y.Z from
#          src/ligaxai/_version.py). `pip install ligaxai` never picks these up; only an explicit
#          pin (`ligaxai==0.1.0.dev42`) or `pip install --pre ligaxai` does. Environment `pypi-dev`.
#   main — a tag `vX.Y.Z` (matching _version.py) publishes the stable release. Environment `pypi`.
#
# PyPI trusted publishing needs one publisher entry per (workflow, environment): register both
# (project `ligaxai`, owner `ligaxai`, repo `ligaxai-python`, workflow `release.yml`,
# environments `pypi` and `pypi-dev`). No token is stored anywhere; OIDC is the credential.
#
# After a stable tag, bump _version.py on `dev` (e.g. 0.1.0 -> 0.1.1) so the next dev build sorts
# above the release: PEP 440 orders 0.1.0.dev1 < 0.1.0 < 0.1.1.dev1.

on:
  push:
    branches: [dev]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}
      version: ${{ steps.meta.outputs.version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0 # to check a release tag's commit is on main
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.30"
          python-version: "3.12"
          # A release is built from a clean resolve: a cache written by any other branch's run
          # must never feed what gets published.
          enable-cache: false
      - name: Resolve channel and version
        id: meta
        run: |
          base="$(uv run --no-project python -c "import re,pathlib;print(re.search(r'\"([^\"]+)\"', pathlib.Path('src/ligaxai/_version.py').read_text()).group(1))")"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "v$base" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$base"; exit 1; }
            # A stable release is only ever a commit already on main: a tag pushed on any other
            # branch's commit (by mistake, or by a compromised account) publishes nothing.
            git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
              || { echo "tag ${GITHUB_REF_NAME} is not on main"; exit 1; }
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "version=$base" >> "$GITHUB_OUTPUT"
          else
            v="${base}.dev${GITHUB_RUN_NUMBER}"
            # The pre-release version is stamped into the build only; nothing is committed.
            printf '__version__ = "%s"\n' "$v" > src/ligaxai/_version.py
            echo "channel=dev" >> "$GITHUB_OUTPUT"
            echo "version=$v" >> "$GITHUB_OUTPUT"
          fi
      - run: uv sync --all-groups --locked
      - run: uv run ruff check src tests scripts examples && uv run mypy && uv run pyright
      - run: uv run pytest
      - run: uv build --no-sources
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Gated on the repository variable PYPI_PUBLISH_ENABLED=true, set once the trusted publishers for
  # `release.yml` + environments `pypi-dev` / `pypi` exist on PyPI. Until then the build above still
  # proves the sdist and wheel, and `skipped` below says why nothing was published — instead of an
  # `invalid-publisher` failure on every push.
  publish:
    needs: build
    if: vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.build.outputs.channel == 'stable' && 'pypi' || 'pypi-dev' }}
      url: https://pypi.org/project/ligaxai/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # trusted publishing (OIDC) — no PyPI token stored anywhere
      contents: read
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
          print-hash: true

  skipped:
    needs: build
    if: vars.PYPI_PUBLISH_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          echo "::notice title=PyPI publish skipped::Built ${VERSION} but did not publish. Add the PyPI trusted publisher (repository ligaxai/ligaxai-python, workflow release.yml, environment pypi-dev and pypi), then set the repository variable PYPI_PUBLISH_ENABLED=true."
